# Example server block for the static export in apps/web/out.
# Adjust server_name and root to match the local machine.
server {
    listen 80;
    server_name localhost;

    root /var/www/devtoys/current;
    index index.html;
    charset utf-8;
    autoindex off;

    # Match the application's configured default locale.
    location = / {
        return 302 /zh-CN/;
    }

    # Next.js emits content-hashed static assets.
    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static export routes use <route>/index.html (trailingSlash: true).
    # This also serves independently imported sites such as /um/.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
